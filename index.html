<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Image Prompt Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700&family=JetBrains+Mono:wght@700&family=Oranienbaum&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBF3E4;--bg2:#F3E9D4;--card:#FFFFFF;--modal:#FFFFFF;--inp:#FBF3E4;
  --bdr:#E7DFCC;--bdr-2:#CFC8BB;--bdr-a:rgba(225,119,13,.4);
  --a1:#E1770D;--a2:#EC8B2B;--a-focus:#E1770D;--a3:#A8641F;
  --a1-rgb:225,119,13;--a3-rgb:168,100,31;--ink-rgb:31,28,25;
  --ink:#1F1C19;--ink-2:#54493C;--ink-3:#867A65;--ink-4:#B0A891;--success:#3E7A4C;
  --sans:'Geist',ui-sans-serif,sans-serif;
  --display:'Oranienbaum','Geist',serif;
  --mono:'Geist Mono',ui-monospace,monospace
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;-webkit-font-smoothing:antialiased;min-height:100vh;letter-spacing:-.005em;scrollbar-color:var(--bdr-2) var(--bg);scrollbar-width:thin}
::-webkit-scrollbar{width:10px;background:var(--bg)}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bdr-2);border-radius:0;border:2px solid var(--bg);min-height:48px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::-webkit-scrollbar-corner{background:var(--bg)}
/* Right panel — always-visible scrollbar (non-overlay) */
.mr::-webkit-scrollbar{width:10px;background:var(--bg2)}
.mr::-webkit-scrollbar-track{background:var(--bg2)}
.mr::-webkit-scrollbar-thumb{background:var(--bdr-2);min-height:48px;border:2px solid var(--bg2);border-radius:0}
.mr::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.mr::-webkit-scrollbar-corner{background:var(--bg2)}
.mr{scrollbar-width:thin;scrollbar-color:var(--bdr-2) var(--bg2)}

/* layout */
.app{display:flex;min-height:100vh}

/* category ribbon */
.cc{flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:11px;font-weight:600;border:none;cursor:pointer;transition:background .18s,color .18s;white-space:nowrap;font-family:var(--sans);background:transparent;letter-spacing:.02em;position:relative;color:var(--ink-2)}
.cc:hover{background:var(--cc,#E1770D);color:#fff}
.cc.active{background:var(--cc,#E1770D);color:#fff;font-weight:700}

/* main */
#main{flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,240,229,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);min-height:56px;display:flex;align-items:center}
.topbar-inner{display:flex;align-items:center;justify-content:flex-end;gap:12px;width:100%;max-width:1280px;margin:0 auto;padding:0 22px}
.tb-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hp-wrap{position:relative;margin-left:auto;flex-shrink:0}
.hp-btn{display:flex;align-items:center;gap:7px;padding:8px 16px;background:transparent;border:none;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:var(--sans);transition:background .15s,color .15s}
.hp-btn:hover,.hp-btn.open{background:var(--a1);color:#fff}
.hp-btn svg{width:14px;height:14px;flex-shrink:0}
.hp-btn .hp-chev{width:11px;height:11px;color:var(--ink-4);transition:transform .15s,color .15s;margin-left:1px}
.hp-btn:hover .hp-chev,.hp-btn.open .hp-chev{color:#fff}
.hp-btn.open .hp-chev{transform:rotate(180deg)}
.hp-panel{display:none;position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:60vh;overflow-y:auto;background:var(--card);border:1px solid var(--bdr);border-radius:0;box-shadow:0 20px 50px rgba(38,33,27,.16);z-index:40;padding:8px}
.hp-group-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);padding:12px 10px 5px;font-family:var(--sans)}
.hp-panel.open{display:block}
.hp-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:0;cursor:pointer;transition:background .12s}
.hp-cam{width:13px;height:13px;flex-shrink:0;color:var(--ink-4)}
.hp-item:hover{background:var(--bg2)}
.hp-item .hp-title{font-size:12.5px;font-weight:600;color:var(--ink)}
.hp-item .hp-cat{font-size:10px;color:var(--ink-4)}
.catbar{position:sticky;top:56px;z-index:29;background:rgba(244,240,229,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);}
.catbar-inner{max-width:1280px;margin:0 auto;padding:10px 22px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cc-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tb-srch{position:relative;display:flex;align-items:center}
.tb-srch svg{position:absolute;left:11px;width:14px;height:14px;color:var(--ink-4);pointer-events:none}
.tb-srch input{padding:7px 12px 7px 32px;background:var(--card);border:1px solid var(--bdr);border-radius:999px;font-size:12px;color:var(--ink);font-family:var(--sans);outline:none;transition:border-color .15s;width:140px;font-weight:500}
.tb-srch input::placeholder{color:var(--ink-4)}
.tb-srch input:focus{border-color:var(--a1);width:230px;transition:width .2s,border-color .15s}

/* content */
.content{flex:1;padding:22px;max-width:1280px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:34px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:0;border:1px solid var(--bdr);background:var(--card);padding:36px 32px}
.hg1,.hg2{display:none}
.hero-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px}
.h-title{font-family:var(--display);font-size:clamp(28px,4vw,42px);font-weight:400;letter-spacing:-.005em;margin-top:0;color:var(--ink)}
.h-desc{font-size:14px;color:var(--ink-2);line-height:1.65;max-width:600px;font-weight:400}
.h-desc strong{color:var(--ink);font-weight:600}

/* cat section */
.cat-sec{display:flex;flex-direction:column;gap:16px}
.cat-hdr{display:flex;align-items:center;gap:12px}
.cat-lbl{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-family:var(--sans)}
.cat-div{flex:1;height:1px;background:var(--bdr)}

/* grid */
.grid{display:grid;grid-template-columns:1fr;gap:26px;align-items:start}

/* card */
.card{position:relative;cursor:pointer;overflow:hidden;border-radius:0;border:1px solid var(--bdr);background:var(--card);padding:20px;transition:all .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.card:hover{border-color:var(--ink-3);box-shadow:0 16px 40px rgba(38,33,27,.1)}
@media(prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-3px)}}
.cg{display:none}
.c-cat{display:inline-flex;align-items:center;padding:4px 10px;border-radius:0;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#fff;width:fit-content;font-family:var(--sans)}
.c-title{font-family:var(--display);font-size:21px;font-weight:400;color:var(--ink);line-height:1.3;transition:color .2s;margin-top:10px;letter-spacing:-.005em}
.card:hover .c-title{color:var(--a1)}
.c-desc{font-size:13px;color:var(--ink-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:7px;font-weight:400}
.wf-tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:13px}
.wt{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:0;font-size:10px;font-family:var(--mono);font-weight:700;letter-spacing:.06em;border:1px solid;transition:filter .15s}
.wt:hover{filter:brightness(.92)}
.wt svg{width:13px;height:13px}
.wt-i{color:#3E6E8C;background:rgba(62,110,140,.08);border-color:rgba(62,110,140,.3)}
.wt-e{color:#9C6A3E;background:rgba(156,106,62,.08);border-color:rgba(156,106,62,.3)}
.wt-v{color:#3E8368;background:rgba(62,131,104,.08);border-color:rgba(62,131,104,.3)}
/* card image strip — one large landscape image per row */
.card-img{width:calc(100% + 40px);margin:-20px -20px 0 -20px;aspect-ratio:2.1/1;overflow:hidden;border-radius:0;position:relative;flex-shrink:0;background:var(--bg2)}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.card:hover .card-img img{transform:scale(1.025)}

.c-date{font-family:var(--sans);color:var(--ink-4);font-size:11px}

/* empty */
.empty{padding:70px 22px;text-align:center;border-radius:0;background:var(--card);border:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:38px;height:38px;color:var(--ink-4)}
.empty h4{font-size:15px;font-weight:600;color:var(--ink);font-family:var(--sans)}
.empty p{font-size:12px;color:var(--ink-3);max-width:340px}
.rst-btn{margin-top:8px;font-size:12px;font-weight:600;color:var(--a1);background:transparent;border:1px solid var(--a1);padding:8px 16px;border-radius:0;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.rst-btn:hover{background:var(--a1);color:var(--ink)}

/* modal */
#mbk{display:none;position:fixed;inset:0;z-index:50;background:rgba(38,33,27,.55);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:14px}
#mbk.on{display:flex}
.modal{position:relative;width:100%;max-width:880px;background:var(--modal);border-radius:0;border:1px solid var(--bdr);box-shadow:0 40px 100px rgba(38,33,27,.3);overflow:hidden}
@media(prefers-reduced-motion:no-preference){.modal{animation:zi .22s cubic-bezier(.16,1,.3,1)}}
@keyframes zi{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.m-cls{position:absolute;top:16px;right:16px;z-index:10;width:34px;height:34px;border-radius:0;background:transparent;border:none;cursor:pointer;color:var(--ink-3);display:flex;align-items:center;justify-content:center;transition:all .15s}
.m-cls:hover{background:var(--bg2);color:var(--ink)}
.m-cls svg{width:18px;height:18px}
.mbody{display:grid;grid-template-columns:1fr;max-height:88vh;overflow-y:auto}
.ml{padding:32px;display:flex;flex-direction:column;gap:24px}
.mr{padding:32px;background:var(--bg2);border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:22px}
.m-ctag{display:inline-flex;align-items:center;padding:4px 12px;border-radius:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#fff;width:fit-content;font-family:var(--sans)}
.m-title{font-family:var(--display);font-size:clamp(24px,4vw,30px);font-weight:400;color:var(--ink);line-height:1.25;letter-spacing:-.005em;margin-top:10px}
.m-desc{font-size:13.5px;color:var(--ink-2);line-height:1.65;font-weight:400}
.vbox{padding:16px;border-radius:0;background:var(--card);border:1px solid var(--bdr);margin-top:22px}
.blbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;gap:5px;font-family:var(--sans)}
.blbl svg{width:13px;height:13px;color:var(--a1)}
.vrow{display:flex;flex-direction:column;gap:5px}
.vrow+.vrow{margin-top:9px}
.vlbl{font-size:11px;font-family:var(--mono);font-weight:600;color:var(--a3)}
.vi{width:100%;padding:7px 12px;background:var(--inp);border:1px solid var(--bdr);border-radius:0;font-size:12px;color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:700;outline:none;transition:border-color .15s}
.vi:hover{border-color:var(--bdr-2)}
.vi:focus{border-color:var(--a1)}
.vi::placeholder{color:var(--ink-4)}
.prev-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin-bottom:8px;display:flex;align-items:center;gap:5px;font-family:var(--sans)}
.prev-lbl svg{width:13px;height:13px;color:var(--a1)}
.prev{padding:16px;border-radius:0;background:var(--inp);border:1px solid var(--bdr);font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink);line-height:1.75;max-height:210px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.vtok{display:inline;padding:1px 5px;margin:0 2px;border-radius:0;font-family:var(--mono);font-size:11px;font-weight:600;transition:all .15s}
.vtok.e{color:var(--a3);background:rgba(var(--a3-rgb),.15);border:1px solid rgba(var(--a3-rgb),.3)}
.vtok.f{color:#2E6E42;background:rgba(62,122,76,.15);border:1px solid rgba(62,122,76,.35);font-weight:700}
.m-acts{padding-top:16px;border-top:1px solid var(--bdr);margin-top:4px}
.cpbtn{width:100%;padding:12px;border-radius:0;font-size:12px;font-weight:700;font-family:var(--sans);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:none;transition:all .25s;letter-spacing:.02em}
.cpbtn.idle{background:var(--ink);color:var(--card)}
.cpbtn.idle:hover{background:var(--a1);color:var(--ink);transform:translateY(-2px)}
.cpbtn.done{background:var(--success);color:#fff}
.cpbtn svg{width:15px;height:15px}
.slbl,.plbl,.srlbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin-bottom:12px;font-family:var(--sans)}
.steps{list-style:none;display:flex;flex-direction:column;gap:11px}
.si{display:flex;gap:10px;font-size:12.5px;color:var(--ink-2);line-height:1.6;font-weight:400}
.sn{flex-shrink:0;width:19px;height:19px;border-radius:50%;background:var(--card);color:var(--a1);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid var(--bdr-2)}
.plist{display:flex;flex-direction:column;gap:7px}
.pi{padding:9px 11px;border-radius:0;background:var(--card);border:1px solid var(--bdr);cursor:pointer;transition:background .15s}
.pi:hover{background:var(--bg)}
.pt{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pn{font-size:12px;font-weight:600;color:var(--a3)}
.pu{font-size:10px;color:var(--ink-4);font-family:var(--mono);display:flex;align-items:center;gap:3px}
.pu svg{width:11px;height:11px;color:var(--ink-4)}
.ptx{font-size:11px;color:var(--ink-4);font-style:italic}
/* workflow tabs */
.tab-bar{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.tab-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:0;font-size:12px;font-weight:600;font-family:var(--sans);border:1px solid var(--bdr);cursor:pointer;background:transparent;color:var(--ink-3);transition:all .15s;letter-spacing:0}
.tab-btn:hover{color:var(--ink);border-color:var(--bdr-2)}
.tab-active{color:var(--ink)}
.tab-num{width:18px;height:18px;border-radius:50%;background:rgba(var(--ink-rgb),.08);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink)}
.tab-active .tab-num{color:#fff}
.tab-hint{font-size:11.5px;color:var(--ink-3);font-weight:500;padding:5px 2px 10px;font-style:italic}
.prev-wrap{display:flex;flex-direction:column;gap:7px}
/* toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(30px);padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--card);font-size:12px;font-weight:700;box-shadow:0 12px 30px rgba(38,33,27,.25);z-index:60;pointer-events:none;transition:all .25s cubic-bezier(.16,1,.3,1);opacity:0;display:flex;align-items:center;gap:7px;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:15px;height:15px;color:var(--card)}

/* responsive */
@media(min-width:700px){
  .content{padding:30px}
  .hero-in{flex-direction:row;align-items:center;justify-content:space-between}
  .vrow{flex-direction:row;align-items:center}
  .vlbl{min-width:130px;flex-shrink:0}
}

</style>
</head>
<body>
<div class="app">
<div id="main">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="tb-r">
        <div class="tb-srch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="sq" placeholder="Search…" oninput="doSearch(this.value)"/>
        </div>
      </div>
    </div>
  </header>
  <nav class="catbar"><div class="catbar-inner">
    <div class="cc-row" id="tb-cats"></div>
    <div class="hp-wrap">
      <button class="hp-btn" id="hpBtn" onclick="toggleHP(event)">
        People Prompts
        <svg class="hp-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="hp-panel" id="hpPanel"></div>
    </div>
  </div></nav>
  <main class="content">
    <div class="hero">
      <div class="hg1"></div><div class="hg2"></div>
      <div class="hero-in">
        <div>
          <h2 class="h-title">AI Image Prompt Library</h2>
          <p class="h-desc" style="margin-top:7px">Browse a collection of AI image and video prompts organized by style, technique, and subject. Preview examples, customize each template, and use it with today's leading AI image models.</p>
        </div>

      </div>
    </div>
    <div id="sec-hdr" style="display:none"></div>
    <div id="plist"></div>
  </main>
</div>
</div>

<div id="mbk" onclick="bkClick(event)">
  <div class="modal" id="modal">
    <button class="m-cls" onclick="closeM()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="mbody"><div class="ml" id="ml"></div><div class="mr" id="mr"></div></div>
  </div>
</div>

<div id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span id="toast-txt"></span></div>

<script>

const CATEGORIES = [
  { id: "miniature",  name: "Miniature Worlds & Dioramas" },
  { id: "city",       name: "City & Urban Scenes" },
  { id: "art",        name: "Art, Maps & Infographics" },
  { id: "brand",      name: "Brand & Product" },
  { id: "food",       name: "Food & Culinary" },
  { id: "scifi",      name: "Sci-Fi & Surreal" },
];
// Folded into the "People Prompts" dropdown rather than the main ribbon —
// kept here only so getCat() can still resolve a name for these cards.
const PERSON_CAT = { id: "people", name: "People Prompts" };
// Thematic groupings for the People Prompts dropdown (by card id)
const PEOPLE_SUBCATS = [
  { label: "Portrait Transformations", ids: ["mar21-i","apr09-e","apr09-f","apr25-6","may14-9","may16-4"] },
  { label: "Fashion & Style",          ids: ["apr25-5","may16-1","mar14-2"] },
  { label: "Career & Growth",          ids: ["mar21-j","apr25-7","may14-5","may16-7","may14-8"] },
  { label: "Travel & Landmarks",       ids: ["apr09-g","apr09-a"] },
  { label: "Brand & Editorial",        ids: ["feb28-f","mar14-7","apr09-d","mar28-d"] },
  { label: "Pop Culture Portraits",    ids: ["apr09-c"] },
];

const GUIDES = [
  { id: "feb28", title: "Nano Banana Pro — Complete Prompt Guide",            date: "2026-02-28", url: "https://www.youtube.com/watch?v=DIsCDGJDuGo" },
  { id: "mar14", title: "Nano Banana 2 — Wild Prompts",                      date: "2026-03-14", url: "https://www.youtube.com/watch?v=yFX7H6Il4Q0" },
  { id: "mar21", title: "Nano Banana 2 is INSANE!",                          date: "2026-03-21", url: "https://www.youtube.com/watch?v=2f2qw6dM-2A" },
  { id: "mar28", title: "Nano Banana 2 — Next-Level Prompts",                date: "2026-03-28", url: "https://www.youtube.com/watch?v=IiqWrisLmzw" },
  { id: "apr09", title: "Nano Banana 2 is CRAZY!",                           date: "2026-04-09", url: "https://www.youtube.com/watch?v=CgFrYiWqi0Q" },
  { id: "apr25", title: "Wild Nano Banana 2 Image Prompts",                  date: "2026-04-25", url: "https://www.youtube.com/watch?v=fzEjUKIGQNQ" },
  { id: "may14", title: "Mind Blowing Nano Banana 2 Prompts",                date: "2026-05-14", url: "https://www.youtube.com/watch?v=TtRAOK5JZm0" },
  { id: "may16", title: "GPT Image 2 vs Nano Banana 2",                      date: "2026-05-16", url: "https://www.youtube.com/watch?v=o832MMJfQBs" }
];

// ═══════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════
function fmtDate(s){ return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function fmtShort(s){ return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function getCat(id){ if(id===PERSON_CAT.id) return PERSON_CAT; return CATEGORIES.find(function(c){ return c.id===id; }) || CATEGORIES[0]; }
function getGuide(id){ return GUIDES.find(function(g){ return g.id===id; }); }
function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function mkEl(tag,cls){ var e=document.createElement(tag||'div'); if(cls) e.className=cls; return e; }

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
var SQ  = '';
var FT  = { type:'all', val:null };
var AP  = null;   // active prompt — we attach _activeTab to this object
var VV  = {};     // { varName: value }

// ═══════════════════════════════════════════════════════════════════
// WORKFLOW BADGE CONSTANTS
// ═══════════════════════════════════════════════════════════════════
var WF_ICONS = {
  IMG:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
  EDIT: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  VID:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>'
};
var WF_CLS = { IMG:'wt-i', EDIT:'wt-e', VID:'wt-v' };
var WF_LBL = { IMG:'IMAGE', EDIT:'EDIT', VID:'VIDEO' };

function wfBadges(p){
  var parts = (p.workflowParts && p.workflowParts.length) ? p.workflowParts : ['IMG'];
  var seen = {}, out = '';
  parts.forEach(function(pt){
    if(!seen[pt]){ seen[pt]=1; out += '<span class="wt '+(WF_CLS[pt]||'wt-i')+'">'+(WF_ICONS[pt]||'')+' '+(WF_LBL[pt]||pt)+'</span>'; }
  });
  return out;
}

// ═══════════════════════════════════════════════════════════════════
// FILTERING
// ═══════════════════════════════════════════════════════════════════
function getFiltered(){
  var q = SQ.toLowerCase().trim();
  var pool = PROMPTS.filter(function(p){ return p.category !== 'people'; });
  if(q){
    return pool.filter(function(p){
      var c = getCat(p.category), g = getGuide(p.guide);
      return p.title.toLowerCase().includes(q)
          || p.description.toLowerCase().includes(q)
          || p.promptText.toLowerCase().includes(q)
          || p.variables.some(function(v){ return v.toLowerCase().includes(q); })
          || (c && c.name.toLowerCase().includes(q))
          || (g && g.title.toLowerCase().includes(q));
    });
  }
  if(FT.type==='category') return pool.filter(function(p){ return p.category===FT.val; });
  if(FT.type==='guide')    return pool.filter(function(p){ return p.guide===FT.val; });
  return pool;
}

// ═══════════════════════════════════════════════════════════════════
// CATEGORY RIBBON
// ═══════════════════════════════════════════════════════════════════
function renderCats(){
  var ribbon = document.getElementById('tb-cats');
  if(!ribbon) return;
  var allActive = FT.type === 'all';
  var out = '<button class="cc'+(allActive?' active':'')+'"'
    +' style="--cc:var(--a1)"'
    +' onclick="setF(\x27all\x27,null)">All</button>';
  CATEGORIES.forEach(function(c){
    var active = FT.type==='category' && FT.val===c.id;
    out += '<button class="cc'+(active?' active':'')+'"'
      +' style="--cc:var(--a1)"'
      +' onclick="setF(\x27category\x27,\x27'+c.id+'\x27)">'
      +c.name+'</button>';
  });
  ribbon.innerHTML = out;
}

// ═══════════════════════════════════════════════════════════════════
// CARD HTML
// ═══════════════════════════════════════════════════════════════════
function cardHTML(p){
  var c = getCat(p.category);
  var imgCls   = 'card-img' + (p.imageClass ? ' '+p.imageClass : '');
  var imgStrip = p.imageUrl
    ? '<div class="'+imgCls+'"><img src="'+p.imageUrl+'" alt="'+escH(p.title)+'" loading="lazy"/></div>'
    : '';
  return '<div class="card" data-pid="'+escH(p.id)+'">'
    +'<div class="cg"></div>'
    +imgStrip
    +'<div>'
    +'<span class="c-cat" style="background:var(--a1)">'+c.name+'</span>'
    +'<h4 class="c-title">'+escH(p.title)+'</h4>'
    +'<p class="c-desc">'+escH(p.description)+'</p>'
    +'<div class="wf-tags">'+wfBadges(p)+'</div>'
    +'</div>'
    +'</div>';
}

// ═══════════════════════════════════════════════════════════════════
// RENDER CARDS
// ═══════════════════════════════════════════════════════════════════
function renderCards(){
  var fl = getFiltered();
  renderCats();

  var pl = document.getElementById('plist');
  if(!fl.length){
    pl.innerHTML = '<div class="empty">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'
      +'<h4>No prompts found</h4>'
      +'<p>Try keywords like "miniature", "city", or "portrait".</p>'
      +'<button class="rst-btn" onclick="clearAll()">Reset filters</button>'
      +'</div>';
    return;
  }

  if(FT.type==='category' && !SQ.trim()){
    pl.innerHTML = '<div class="grid">'+fl.map(cardHTML).join('')+'</div>';
    return;
  }

  var grp = {};
  fl.forEach(function(p){ if(!grp[p.category]) grp[p.category]=[]; grp[p.category].push(p); });
  var out = '<div style="display:flex;flex-direction:column;gap:38px">';
  CATEGORIES.forEach(function(c){
    var items = grp[c.id];
    if(!items||!items.length) return;
    out += '<div class="cat-sec"><div class="cat-hdr">'
      +'<span class="cat-lbl" style="color:var(--a1)">'+c.name+'</span>'
      +'<span class="cat-div"></span>'
      +'</div><div class="grid">'+items.map(cardHTML).join('')+'</div></div>';
  });
  pl.innerHTML = out+'</div>';
}

// Event delegation for card clicks
document.addEventListener('click', function(e){
  var card = e.target.closest('[data-pid]');
  if(card) openM(card.dataset.pid);
});

// ═══════════════════════════════════════════════════════════════════
// MODAL OPEN / CLOSE
// ═══════════════════════════════════════════════════════════════════
function openM(id){
  AP = PROMPTS.find(function(p){ return p.id===id; });
  if(!AP) return;
  VV = {};
  AP._activeTab = AP.promptText ? 'IMG' : (AP.editPrompt ? 'EDIT' : 'VID');
  buildModal();
  document.getElementById('mbk').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closeM(){
  document.getElementById('mbk').classList.remove('on');
  document.body.style.overflow = '';
  AP = null; VV = {};
}

function bkClick(e){
  if(e.target === document.getElementById('mbk')) closeM();
}

// ═══════════════════════════════════════════════════════════════════
// BUILD MODAL — called on open and on every tab switch
// ═══════════════════════════════════════════════════════════════════
function buildModal(){
  var p  = AP;
  var c  = getCat(p.category);
  var g  = getGuide(p.guide);
  var ml = document.getElementById('ml');
  var mr = document.getElementById('mr');

  // Build tab list from available prompt fields
  var tabs = [];
  if(p.promptText)  tabs.push({ key:'IMG',  label:'Image Prompt', cls:'wt-i', color:'#3E6E8C', hint:'Paste into your AI image tool → Create Image' });
  if(p.editPrompt)  tabs.push({ key:'EDIT', label:'Edit Prompt',  cls:'wt-e', color:'#9C6A3E', hint:'Paste in the same AI image tool chat as a follow-up edit' });
  if(p.videoPrompt) tabs.push({ key:'VID',  label:'Video Prompt', cls:'wt-v', color:'#3E8368', hint:'Upload frames to your AI video tool, then paste this prompt' });
  var isMulti = tabs.length > 1;

  var activeTab = tabs.find(function(t){ return t.key === AP._activeTab; }) || tabs[0];

  // ── LEFT PANEL ─────────────────────────────────────────────────
  ml.innerHTML = '';

  // Category tag
  var ctag = mkEl('span','m-ctag');
  ctag.textContent = c.name;
  ctag.style.cssText = 'background:var(--a1)';
  ml.appendChild(ctag);

  // Title
  var titleEl = mkEl('h3','m-title'); titleEl.textContent = p.title;
  ml.appendChild(titleEl);

  // Description
  var descEl = mkEl('p','m-desc'); descEl.textContent = p.description;
  ml.appendChild(descEl);

  // Tab bar (multi-step only)
  if(isMulti){
    var tabBar = mkEl('div','tab-bar');
    tabs.forEach(function(t, i){
      var btn = mkEl('button','tab-btn'+(AP._activeTab===t.key?' tab-active':''));
      if(AP._activeTab===t.key){
        btn.style.cssText = 'border-color:'+t.color+';color:'+t.color+';background:'+t.color+'18';
      }
      var tabLabel = (p.customTabs && p.customTabs[t.key]) || t.label;
      var num = mkEl('span','tab-num');
      num.textContent = i+1;
      if(AP._activeTab===t.key) num.style.background = t.color;
      btn.appendChild(num);
      btn.appendChild(document.createTextNode(' '+tabLabel));
      (function(tab){ btn.addEventListener('click', function(){ AP._activeTab=tab.key; buildModal(); }); })(t);
      tabBar.appendChild(btn);
    });
    ml.appendChild(tabBar);
    var hint = mkEl('p','tab-hint'); hint.textContent = activeTab.hint;
    ml.appendChild(hint);
  }

  // Variable inputs — show on ALL tabs, values carry across all prompts
  if(p.variables.length > 0){
    var vbox = mkEl('div','vbox');
    var vlbl = mkEl('div','blbl');
    vlbl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
      +'<rect x="2" y="3" width="20" height="14" rx="2"/>'
      +'<line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>'
      +'</svg>Your Variables — applied to all prompts';
    vbox.appendChild(vlbl);
    p.variables.forEach(function(v, i){
      var row = mkEl('div','vrow');
      if(i>0) row.style.marginTop = '9px';
      var lbl = mkEl('label','vlbl'); lbl.textContent = v;
      row.appendChild(lbl);
      var inp = mkEl('input','vi');
      inp.type = 'text'; inp.placeholder = 'Enter value for '+v; inp.value = VV[v]||'';
      (function(varName){ inp.addEventListener('input', function(){ VV[varName]=this.value; renderPrev(); }); })(v);
      row.appendChild(inp); vbox.appendChild(row);
    });
    ml.appendChild(vbox);
  }

  // Preview
  var prevWrap = mkEl('div','prev-wrap');
  var prevLbl  = mkEl('div','prev-lbl');
  prevLbl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
    +'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>'
    +'<line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    +(isMulti ? ((p.customTabs && p.customTabs[activeTab.key]) || activeTab.label)+' Preview' : 'Prompt Preview');
  prevWrap.appendChild(prevLbl);
  var prevBox = mkEl('div','prev'); prevBox.id = 'modal-prev';
  prevWrap.appendChild(prevBox);
  ml.appendChild(prevWrap);

  // Copy button
  var acts = mkEl('div','m-acts');
  var cpBtn = mkEl('button','cpbtn idle'); cpBtn.id = 'cpbtn';
  cpBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
    +'<rect x="9" y="9" width="13" height="13" rx="2"/>'
    +'<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
    +' Copy '+(isMulti ? ((p.customTabs && p.customTabs[activeTab.key]) || activeTab.label) : 'Completed Prompt');
  cpBtn.addEventListener('click', doCopy);
  acts.appendChild(cpBtn); ml.appendChild(acts);

  // ── RIGHT PANEL ───────────────────────────────────────────────
  mr.innerHTML = '';

  if(p.steps && p.steps.length){
    var sec = mkEl('div');
    var hdr = mkEl('p','slbl'); hdr.textContent = 'Instructions';
    sec.appendChild(hdr);
    var ul = mkEl('ul','steps');
    p.steps.forEach(function(s, i){
      var li=mkEl('li','si'); var num=mkEl('span','sn'); num.textContent=i+1;
      var txt=mkEl('span'); txt.textContent=s;
      li.appendChild(num); li.appendChild(txt); ul.appendChild(li);
    });
    sec.appendChild(ul); mr.appendChild(sec);
  }

  renderPrev();
}

// ═══════════════════════════════════════════════════════════════════
// LIVE PREVIEW
// ═══════════════════════════════════════════════════════════════════
function renderPrev(){
  var box = document.getElementById('modal-prev');
  if(!box || !AP) return;
  while(box.firstChild) box.removeChild(box.firstChild);

  var activeKey = AP._activeTab || 'IMG';
  var text = '';
  if(activeKey==='IMG')  text = AP.promptText  || '';
  if(activeKey==='EDIT') text = AP.editPrompt  || '';
  if(activeKey==='VID')  text = AP.videoPrompt || '';

  // Highlight variable tokens on ALL tabs — filled = green, empty = purple
  if(!AP.variables.length){
    box.textContent = text;
    return;
  }

  // IMG with variables: highlight tokens
  var varSet = {};
  AP.variables.forEach(function(v){ varSet[v]=true; });
  var escaped = AP.variables.map(function(v){ return v.replace(/[-[\]{}()*+?.,\\^$|#\s]/g,'\\$&'); });
  var segs;
  try { segs = text.split(new RegExp('('+escaped.join('|')+')', 'g')); }
  catch(err){ box.textContent=text; return; }

  segs.forEach(function(seg){
    if(varSet[seg]){
      var val=VV[seg], filled=val&&val.trim().length>0;
      var sp=document.createElement('span');
      sp.className=filled?'vtok f':'vtok e';
      sp.textContent=filled?'['+val.trim()+']':seg;
      box.appendChild(sp);
    } else {
      box.appendChild(document.createTextNode(seg));
    }
  });
}

// ═══════════════════════════════════════════════════════════════════
// COPY — compiles IMG prompt with variable substitution
// ═══════════════════════════════════════════════════════════════════
function doCopy(){
  var activeKey = AP._activeTab || 'IMG';
  var text = '';
  if(activeKey==='IMG')  text = AP.promptText  || '';
  if(activeKey==='EDIT') text = AP.editPrompt  || '';
  if(activeKey==='VID')  text = AP.videoPrompt || '';

  // Substitute variables into ALL tabs
  AP.variables.forEach(function(v){
    var val=VV[v];
    if(val&&val.trim()){
      var esc=v.replace(/[-[\]{}()*+?.,\\^$|#\s]/g,'\\$&');
      text=text.replace(new RegExp(esc,'g'),'['+val.trim()+']');
    }
  });

  navigator.clipboard.writeText(text).then(function(){
    var b=document.getElementById('cpbtn'); if(!b) return;
    b.className='cpbtn done';
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
      +'<polyline points="20 6 9 17 4 12"/></svg> Copied!';
    showToast('Copied to clipboard!');
    setTimeout(function(){
      var b2=document.getElementById('cpbtn'); if(!b2) return;
      b2.className='cpbtn idle';
      var activeTab2=(AP&&AP._activeTab)||'IMG';
      var labels={IMG:'Image Prompt',EDIT:(AP&&AP.customTabs&&AP.customTabs.EDIT)||'Edit Prompt',VID:'Video Prompt'};
      b2.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
        +'<rect x="9" y="9" width="13" height="13" rx="2"/>'
        +'<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
        +' Copy '+(labels[activeTab2]||'Completed Prompt');
    },2000);
  }).catch(function(){ showToast('Failed to copy — press Ctrl+C manually.'); });
}

// ═══════════════════════════════════════════════════════════════════
// PRESETS
// ═══════════════════════════════════════════════════════════════════
function loadPreset(i){
  var p=AP, ex=p.examples[i]; if(!ex) return;
  if(p.variables.length===2){
    var pts=ex.label.split('/');
    if(pts.length===2){ VV[p.variables[0]]=pts[0].trim(); VV[p.variables[1]]=pts[1].trim(); }
    else { VV[p.variables[0]]=ex.label; }
  } else if(p.variables.length>=1){ VV[p.variables[0]]=ex.label; }
  document.querySelectorAll('#ml .vi').forEach(function(el,idx){ if(p.variables[idx]) el.value=VV[p.variables[idx]]||''; });
  renderPrev();
  showToast('Loaded: '+ex.label);
}

// ═══════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════
var _tt=null;
function showToast(msg){
  document.getElementById('toast-txt').textContent=msg;
  var t=document.getElementById('toast');
  t.classList.add('on');
  clearTimeout(_tt);
  _tt=setTimeout(function(){ t.classList.remove('on'); },2200);
}

// NAV
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// PEOPLE PROMPTS — People & Portraits folded into this dropdown, reachable from the ribbon
// ═══════════════════════════════════════════════════════════════════
function renderHP(){
  var list = PROMPTS.filter(function(p){ return p.category === 'people'; });
  var panel = document.getElementById('hpPanel');
  if(!panel) return;
  var byId = {};
  list.forEach(function(p){ byId[p.id] = p; });
  var placed = {};
  var groups = PEOPLE_SUBCATS.map(function(sc){
    var items = sc.ids.map(function(id){ return byId[id]; }).filter(Boolean);
    items.forEach(function(p){ placed[p.id] = true; });
    return { label: sc.label, items: items };
  });
  var leftover = list.filter(function(p){ return !placed[p.id]; });
  if(leftover.length) groups.push({ label: 'Other', items: leftover });
  panel.innerHTML = groups.map(function(grp){
    if(!grp.items.length) return '';
    return '<div class="hp-group-lbl">'+grp.label+'</div>'
      + grp.items.map(function(p){
          return '<div class="hp-item" data-pid="'+escH(p.id)+'">'
            +'<span class="hp-title">'+escH(p.title)+'</span>'
            +(p.personalPhoto ? '<svg class="hp-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>' : '')
            +'</div>';
        }).join('');
  }).join('');
}
function toggleHP(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('hpPanel');
  var btn = document.getElementById('hpBtn');
  if(!panel || !btn) return;
  var isOpen = panel.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
}
document.addEventListener('click', function(e){
  var item = e.target.closest('.hp-item');
  if(item){
    openM(item.dataset.pid);
    var panel = document.getElementById('hpPanel');
    var btn = document.getElementById('hpBtn');
    if(panel) panel.classList.remove('open');
    if(btn) btn.classList.remove('open');
    return;
  }
  var panel = document.getElementById('hpPanel');
  var btn = document.getElementById('hpBtn');
  if(!panel || !panel.classList.contains('open')) return;
  if(e.target.closest('#hpPanel') || e.target.closest('#hpBtn')) return;
  panel.classList.remove('open');
  if(btn) btn.classList.remove('open');
});

function setF(type,val){ FT={type:type,val:val}; SQ=''; var sq=document.getElementById('sq'); if(sq) sq.value=''; renderCats(); renderCards(); }
function doSearch(v){ SQ=v; renderCats(); renderCards(); }
function clearAll(){ SQ=''; FT={type:'all',val:null}; var sq=document.getElementById('sq'); if(sq) sq.value=''; renderCats(); renderCards(); }

// ═══════════════════════════════════════════════════════════════════
// KEYBOARD + INIT
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeM(); });
renderCats();
renderCards();
renderHP();
</script>
